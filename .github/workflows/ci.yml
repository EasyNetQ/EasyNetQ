name: CI

on:
  push:
    branches:
      - master
      - '[0-9]+.x'
    tags: [ '[0-9]+.[0-9]+.[0-9]+*' ]
  pull_request:
    branches:
      - master
      - develop
    types: [ opened, synchronize, reopened, labeled ]
  schedule:
    # nightly benchmark run on master
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET (global.json)
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Install dependencies
      run: dotnet restore ${{ github.workspace }}/Source/EasyNetQ.slnx

    - name: Check formatting
      run: dotnet format --no-restore --verify-no-changes --severity warn ./Source/EasyNetQ.slnx || (echo "Run 'dotnet format' to fix issues" && exit 1)

    - name: Build
      run: dotnet build ${{ github.workspace }}/Source/EasyNetQ.slnx --configuration Release

    - name: Tests
      run: |
        cd ${{ github.workspace }}/Source/EasyNetQ.Tests
        dotnet test --configuration Release --no-build

    - name: Allocation Tests
      run: |
        cd ${{ github.workspace }}/Source/EasyNetQ.AllocationTests
        dotnet test --configuration Release --no-build

    - name: Serialization.Tests
      run: |
        cd ${{ github.workspace }}/Source/EasyNetQ.Serialization.Tests
        dotnet test --configuration Release --no-build

    - name: Hosepipe.Tests
      run: |
        cd ${{ github.workspace }}/Source/EasyNetQ.Hosepipe.Tests
        dotnet test --configuration Release --no-build --filter "(Category!=Explicit)"

    - name: Integration Tests
      run: |
        cd ${{ github.workspace }}/Source/EasyNetQ.IntegrationTests
        dotnet test --configuration Release --no-build

    - name: Approval Tests
      run: |
        cd ${{ github.workspace }}/Source/EasyNetQ.ApprovalTests
        dotnet test --configuration Release --no-build

  aot-smoke:
    name: Native AOT smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET (global.json)
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Publish with PublishAot
      shell: bash
      run: |
        set -o pipefail
        dotnet publish ${{ github.workspace }}/Source/EasyNetQ.Examples.Aot --configuration Release --runtime linux-x64 --output ${{ github.workspace }}/aot-out 2>&1 | tee aot-publish.log

    - name: Summarize trim/AOT warnings
      shell: bash
      run: |
        total=$(grep -cE 'warning IL[23][0-9]{3}' aot-publish.log || true)
        easynetq=$(grep -E 'warning IL[23][0-9]{3}' aot-publish.log | grep -cE 'EasyNetQ[^/]*\.dll|EasyNetQ[^/]*\.cs' || true)
        {
          echo "## Native AOT smoke"
          echo ""
          echo "| Trim/AOT warnings | Count |"
          echo "|---|---|"
          echo "| total | $total |"
          echo "| from EasyNetQ assemblies | $easynetq |"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "IL warnings: total=$total easynetq=$easynetq"

    - name: Upload publish log
      uses: actions/upload-artifact@v4
      with:
        name: aot-publish-log
        path: aot-publish.log

  benchmarks:
    name: Benchmarks
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmark'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET (8.x runtime + global.json SDK)
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.x'
        global-json-file: global.json

    - name: Run benchmarks (short job)
      run: >-
        dotnet run --project ${{ github.workspace }}/Source/EasyNetQ.Benchmarks
        --configuration Release --framework net10.0 --
        --filter '*' --job short --artifacts ${{ github.workspace }}/BenchmarkDotNet.Artifacts

    - name: Publish results to job summary
      shell: bash
      run: |
        for f in ${{ github.workspace }}/BenchmarkDotNet.Artifacts/results/*-report-github.md; do
          cat "$f" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: ${{ github.workspace }}/BenchmarkDotNet.Artifacts

  publish-to-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    environment: release
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install dependencies
        run: dotnet restore ${{ github.workspace }}/Source/EasyNetQ.slnx
      - name: Build
        run: dotnet build ${{ github.workspace }}/Source/EasyNetQ.slnx --configuration Release
      - name: Pack
        run: dotnet pack ${{ github.workspace }}/Source/EasyNetQ.slnx --configuration Release --no-build --include-symbols -p:PackageOutputPath="${{ github.workspace }}/Packages"
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: EasyNetQ
      - name: Publish
        run: dotnet nuget push '${{ github.workspace }}/Packages/*.*' --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
