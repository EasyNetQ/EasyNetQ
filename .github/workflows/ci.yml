name: CI

on:
  push:
    branches:
      - master
      - '[0-9]+.x'
    tags: [ '[0-9]+.[0-9]+.[0-9]+*' ]
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        dotnet: ['8.*']
      fail-fast: true
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET Core ${{ matrix.dotnet }}
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet }}

    - name: Install dependencies
      run: dotnet restore ${{ github.workspace }}/Source/EasyNetQ.slnx

    - name: Check formatting
      run: dotnet format --no-restore --verify-no-changes --severity warn ./Source/EasyNetQ.slnx || (echo "Run 'dotnet format' to fix issues" && exit 1)

    - name: Build
      run: dotnet build ${{ github.workspace }}/Source/EasyNetQ.slnx --configuration Release

    - name: Tests
      run: |
        cd ${{ github.workspace }}/Source/EasyNetQ.Tests
        dotnet test --configuration Release --no-build

    - name: Serialization.Tests
      run: |
        cd ${{ github.workspace }}/Source/EasyNetQ.Serialization.Tests
        dotnet test --configuration Release --no-build

    - name: Hosepipe.Tests
      run: |
        cd ${{ github.workspace }}/Source/EasyNetQ.Hosepipe.Tests
        dotnet test --configuration Release --no-build --filter "(Category!=Explicit)"

    - name: Integration Tests
      run: |
        cd ${{ github.workspace }}/Source/EasyNetQ.IntegrationTests
        dotnet test --configuration Release --no-build

    - name: Approval Tests
      run: |
        cd ${{ github.workspace }}/Source/EasyNetQ.ApprovalTests
        dotnet test --configuration Release --no-build

  publish-to-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    environment: release
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET Core 8.x
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.*'
      - name: Install dependencies
        run: dotnet restore ${{ github.workspace }}/Source/EasyNetQ.slnx
      - name: Build
        run: dotnet build ${{ github.workspace }}/Source/EasyNetQ.slnx --configuration Release
      - name: Pack
        run: dotnet pack ${{ github.workspace }}/Source/EasyNetQ.slnx --configuration Release --no-build --include-symbols -p:PackageOutputPath="${{ github.workspace }}/Packages"
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # nuget.org username of the org member who CREATED the trusted publishing
          # policy (not the EasyNetQ org that owns it - orgs cannot create policies).
          user: ${{ secrets.NUGET_USER }}
      - name: Publish
        run: dotnet nuget push '${{ github.workspace }}/Packages/*.*' --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
